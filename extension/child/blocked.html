<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Website blocked</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">!</div>
    <h1>Blocked by Admin</h1>
    <p>This website isn't available under the family browsing rules.</p>
    <p class="hint">You can ask your parent or guardian to review this restriction.</p>
    <form id="request-form">
      <label for="domain">Website you want to request</label>
      <input id="domain" name="domain" inputmode="url" autocomplete="url" placeholder="example.com" required maxlength="253">
      <button type="submit">Request parent approval</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
